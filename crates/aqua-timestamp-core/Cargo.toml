[package]
name        = "aqua-timestamp-core"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "Core types and primitives for the Aqua Aggregator (epoch, accumulator, witness minting)."

[features]
# Self-check test doubles (`selfcheck::doubles`): simulated chain and TSA that
# are their own verification hosts. Tests and the offline e2e selfcheck only.
test-doubles = []

[dependencies]
aqua-rs-sdk = { workspace = true }
aqua-auth   = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
hex        = { workspace = true }
sha3       = { workspace = true }
thiserror  = { workspace = true }
chrono     = { workspace = true }
tracing    = { workspace = true }
async-trait = { workspace = true }

fjall    = { workspace = true }
postcard = { workspace = true }
tokio    = { workspace = true }

[dev-dependencies]
aqua-timestamp-core = { path = ".", features = ["test-doubles"] }
tracing-subscriber = { workspace = true }
aqua-evm-provider = { workspace = true }
# OW1.1 (tests/witness_sdk_verify.rs): the SDK's TSA host as the reader's verifier,
# and the crates the copied SDK test-token generator (tests/support/test_tsa.rs)
# needs; all already in the graph through aqua-tsa-provider.
aqua-tsa-provider  = { workspace = true }
aqua-qualified-pki = { workspace = true }
base64    = "0.22"
cms       = "0.2"
const-oid = "0.9"
der       = { version = "0.7", features = ["std"] }
p256      = { version = "0.14", features = ["ecdsa", "pkcs8"] }
sha2      = "0.10"
spki      = "0.7"
x509-cert = "0.2"
x509-tsp  = "0.1"
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }
