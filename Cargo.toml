[workspace]
resolver = "2"
members = [
    "crates/aqua-timestamp",
    "crates/aqua-timestamp-core",
    "crates/aqua-timestamp-client",
    "crates/aqua-timestamp-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/inblockio/aqua-timestamps"
rust-version = "1.85"

[workspace.dependencies]
# Train dependencies (aqua-ops train/train.toml, rules in
# development-conventions/CONVENTIONS-dependency-pins.md): normally pinned by
# annotated release tag, canonical https URL, one git source per repo.
# aqua-evm-provider and aqua-tsa-provider are crates of the aqua-rs-sdk repo and
# share its pin.
#
# TEMPORARY (OW1, branch ow/1-dual-anchor): pinned by rev to aqua-rs-sdk main
# b8859a16 for the two-phase batch producer (#213 prepare_batch_timestamp /
# finish_batch_timestamp) and #238. No SDK release tag holds them yet (newest is
# v7.0.0, 2026-10-18). The merge of this branch into aqua-timestamps main waits
# for the release train: repin to the first release tag that contains b8859a16.
aqua-rs-sdk       = { git = "https://github.com/inblockio/aqua-rs-sdk", rev = "b8859a1682784050b3ec2f17244bb098f7c191f4", default-features = false, features = ["native"] }
aqua-evm-provider = { git = "https://github.com/inblockio/aqua-rs-sdk", rev = "b8859a1682784050b3ec2f17244bb098f7c191f4" }
aqua-tsa-provider = { git = "https://github.com/inblockio/aqua-rs-sdk", rev = "b8859a1682784050b3ec2f17244bb098f7c191f4" }
# Test-only (OW1.1 TSA token fixture), same repo and pin as aqua-rs-sdk.
aqua-qualified-pki = { git = "https://github.com/inblockio/aqua-rs-sdk", rev = "b8859a1682784050b3ec2f17244bb098f7c191f4" }
aqua-auth         = { git = "https://github.com/inblockio/aqua-auth", tag = "v0.9.0", default-features = false, features = ["http"] }

# Async + HTTP
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
axum         = { version = "0.8", features = ["macros"] }
tower        = "0.5"
tower-http   = { version = "0.6", features = ["trace", "cors"] }
hyper        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serde
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.9"

# Logging / observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto helpers
hex   = "0.4"
sha3  = "0.10"
rand  = "0.8"

# Ethereum RPC (bonding curve oracle)
alloy = { version = "2", default-features = false, features = ["provider-http", "reqwest-rustls-tls", "rpc-types", "network"] }

# Storage
fjall    = "2"
postcard = { version = "1", features = ["use-std"] }

# CLI + config
clap     = { version = "4", features = ["derive"] }
anyhow   = "1"
thiserror = "2"
async-trait = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Test-only
proptest = "1"
tempfile = "3"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3
