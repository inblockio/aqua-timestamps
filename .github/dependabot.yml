# Dependabot (inblock security track, M2; template: aqua-ops security/response/dependabot/).
# Version updates: weekly, minor and patch grouped per ecosystem, majors one PR each, 7-day
# cooldown (a poisoned release is usually caught within days). Security updates: one PR per
# advisory, opened at once; the cooldown does not hold them.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # Our own crates (git dependencies, aqua-rs-sdk is private) move with the aqua-ops pin train,
      # not with Dependabot; in this public repository an update PR could also list the private
      # repository's commit titles (Tim 2026-10-24).
      - dependency-name: "aqua-*"

  - package-ecosystem: docker
    directory: /deploy
    schedule: {interval: weekly, day: monday, time: "05:00", timezone: Europe/Berlin}
    cooldown: {default-days: 7}
